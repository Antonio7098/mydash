name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check source integrity
        run: npm run check:source
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build TypeScript output
        run: npm run build
      - name: Validate workspace
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Run release smoke test
        run: npm run smoke
