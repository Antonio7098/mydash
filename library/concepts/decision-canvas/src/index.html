<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f3e8e4;color:#312521;font:16px Arial}.canvas{display:grid;width:78%;grid-template-columns:repeat(3,1fr);gap:16px}.card{min-height:180px;padding:22px;border-radius:22px;background:#fff;box-shadow:0 18px 45px #5d3d3418}.card:nth-child(2){transform:translateY(-28px);background:#c99b90;color:#fff}b{display:block;margin-bottom:20px;font-size:14px}.card span{font-size:26px;font-weight:700;letter-spacing:-.04em}</style></head><body><main class="canvas"><div class="card"><b>01</b><span>Evidence</span></div><div class="card"><b>02</b><span>Choice</span></div><div class="card"><b>03</b><span>Action</span></div></main></body></html>
