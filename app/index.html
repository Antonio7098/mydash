<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <meta
      name="description"
      content="Browse, preview and export My Dashboards artefacts."
    >
    <title>My Dashboards</title>
    <link rel="stylesheet" href="/navigator/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#page-content">Skip to content</a>

    <header class="navigator-chrome">
      <nav
        class="navigator-nav"
        id="navigator-nav"
        aria-label="Primary navigation"
        data-open="false"
      >
        <button
          class="navigator-nav__toggle"
          id="nav-toggle"
          type="button"
          aria-controls="nav-panel"
          aria-expanded="false"
        >
          <span class="navigator-mark" aria-hidden="true">
            <span class="navigator-mark__bar"></span>
            <span class="navigator-mark__letters">MD</span>
          </span>
          <span class="navigator-nav__toggle-label">My Dashboards</span>
          <span class="navigator-nav__chevron" aria-hidden="true">›</span>
        </button>

        <div class="navigator-nav__panel" id="nav-panel">
          <a href="/" data-navigator-link data-route="home">Home</a>
          <a
            href="/dashboards"
            data-navigator-link
            data-route="dashboards"
          >
            Dashboards
          </a>
          <a
            href="/presentations"
            data-navigator-link
            data-route="presentations"
          >
            Presentations
          </a>
          <a
            href="/concepts"
            data-navigator-link
            data-route="concepts"
          >
            Concepts
          </a>
          <a
            href="/components"
            data-navigator-link
            data-route="components"
          >
            Library
          </a>

          <div class="navigator-nav__separator" role="separator"></div>

          <a
            href="/settings"
            data-navigator-link
            data-route="settings"
          >
            Settings
          </a>
          <a href="/api" target="_blank" rel="noreferrer">API</a>
        </div>
      </nav>

      <label class="category-switcher">
        <span class="visually-hidden">Current section</span>
        <select id="category-selector" aria-label="Current section">
          <option value="/">Home</option>
          <option value="/dashboards">Dashboards</option>
          <option value="/presentations">Presentations</option>
          <option value="/concepts">Concepts</option>
          <option value="/components">Library</option>
          <option value="/settings">Settings</option>
        </select>
      </label>

      <div
        class="connection-status"
        id="connection-status"
        data-state="loading"
        role="status"
        aria-live="polite"
      >
        <span class="connection-status__dot" aria-hidden="true"></span>
        <span id="connection-status-label">Connecting</span>
      </div>
    </header>

    <main class="navigator-main" id="page-content" tabindex="-1">
      <section class="navigator-loading" aria-live="polite">
        <p class="navigator-eyebrow">My Dashboards</p>
        <h1>Opening your workspace</h1>
        <p>Reading artefacts and shared resources from the repository.</p>
      </section>
    </main>

    <footer class="navigator-footer">
      <span>Repository-backed</span>
      <span aria-hidden="true">·</span>
      <span id="footer-revision">Revision loading</span>
    </footer>

    <script type="module" src="/navigator/main.js"></script>
  </body>
</html>
